name: appstudio
description: Self-contained macOS IDE for Serverpod projects.
publish_to: 'none'
version: 0.2.3+22

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_cef:
    path: packages/webview_cef
  file_selector: ^1.0.3
  shared_preferences: ^2.5.3
  path: ^1.9.1
  http: ^1.4.0
  # Verifying downloaded toolchain archives (sha256).
  crypto: ^3.0.7
  flutter_markdown: ^0.7.7+1
  mac_menu_bar:
    path: packages/mac_menu_bar
  mesh_gradient: ^1.3.8
  shimmer: ^3.0.0
  shad: ^0.99.3
  # The runner's attach protocol (`lib/runner/`). The same package the runner
  # serves it with, so the framing and error shapes cannot drift.
  json_rpc_2: ^4.0.0
  stream_channel: ^2.1.2
  meta: ^1.16.0
  # Windows: the registry (Developer Mode, the user PATH), the UAC prompt and
  # the environment-change broadcast, called directly rather than through
  # PowerShell (lib/platform/windows/).
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  widgetbook: ^3.25.0
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    # Headline face. Bundled rather than reached for through `shad`'s own copy
    # so the display type cannot change under us when the package updates.
    # Black is the only weight we ship — headlines are the only thing that uses
    # it, and 400 KB is already the largest asset in the app.
    # SIL Open Font License 1.1, see assets/fonts/Inter-LICENSE.txt.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
