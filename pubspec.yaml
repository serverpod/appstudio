name: appstudio
description: Self-contained macOS IDE for Serverpod projects.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shadcn_ui: ^0.54.0
  xterm: ^4.0.0
  kyroon_pty: ^1.0.4
  webview_cef: ^0.5.1
  file_selector: ^1.0.3
  shared_preferences: ^2.5.3
  path: ^1.9.1
  http: ^1.4.0
  flutter_markdown: ^0.7.7+1
  mac_menu_bar:
    path: packages/mac_menu_bar
  mesh_gradient: ^1.3.8
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
