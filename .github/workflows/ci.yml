# Analyze and test on macOS and Windows.
#
# macOS is the gate that the Windows port changes nothing for macOS users:
# the whole existing suite, including the `tool` tests for the release
# scripts. Windows runs the same suite, including the `process` tests (real
# child processes and AF_UNIX fake runners) that are not run on the Windows
# dev laptop — see the `process` tag in dart_test.yaml and the afunix.sys risk
# in specs/windows_port.md. On a hosted runner, a crash there only costs a VM.
name: CI

on:
  push:
    branches: [main, 'windows/**', 'spike/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: flutter test

      # Windows runs in pieces. Every full run so far took the machine down
      # mid-test: the step limit below never fired and the job ran out its
      # 30 minutes, which a hang inside a test cannot do. The likely cause is
      # the afunix.sys crash in specs/windows_afunix_bsod_report.md, set off by
      # a test process exiting with an AF_UNIX socket open. Separate steps name
      # the file: the one left "in progress" is the one that was running.
      #
      # Reading a job's log needs a GitHub sign-in; its annotations do not, so
      # what matters is reported as annotations.
      - name: Windows build and afunix.sys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $afunix = (Get-Item "$env:SystemRoot\System32\drivers\afunix.sys").VersionInfo.FileVersion
          "::notice title=Windows and afunix.sys::$($cv.ProductName) build $($cv.CurrentBuild).$($cv.UBR), afunix.sys $afunix"

      # One test file at a time, as on the dev laptop.
      - name: Test (Windows, no processes or sockets)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: flutter test -x process -j 1

      - name: Test (Windows, runner discovery)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: flutter test test/runner/runner_discovery_test.dart

      - name: Test (Windows, Serverpod process)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: flutter test test/process/serverpod_process_test.dart
