# Analyze and test on macOS and Windows.
#
# macOS is the gate that the Windows port changes nothing for macOS users:
# the whole existing suite, including the `tool` tests for the release
# scripts. Windows runs the same suite, including the `process` tests (real
# child processes and AF_UNIX fake runners) that are not run on the Windows
# dev laptop — see the `process` tag in dart_test.yaml and the afunix.sys risk
# in specs/windows_port.md. On a hosted runner, a crash there only costs a VM.
name: CI

on:
  push:
    branches: [main, 'windows/**', 'spike/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: flutter test

      # Every test that opens no AF_UNIX socket. The socket tests have a job of
      # their own (windows-sockets, below).
      - name: Test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: flutter test -x process -j 1

  # The AF_UNIX socket tests on Windows, apart so the rest of CI reports
  # whatever happens to them.
  #
  # Runs here have taken the machine down mid-test: the step limit never
  # fired and the job ran out its 30 minutes, which a hang inside a test
  # cannot do. The cause is the afunix.sys crash in
  # specs/windows_afunix_bsod_report.md. The socket test files let Windows
  # finish closing sockets before they end (test/support/afunix_guard.dart);
  # with that, runner discovery passes. serverpod_process_test still crashed
  # the machine, so it runs one group per step: the step left "in progress"
  # names the group. A failing step does not skip the next; only a crash
  # stops the job.
  #
  # Reading a job's log needs a GitHub sign-in; its annotations do not, so
  # what matters is reported as annotations.
  windows-sockets:
    name: windows sockets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Windows build and afunix.sys
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $afunix = (Get-Item "$env:SystemRoot\System32\drivers\afunix.sys").VersionInfo.FileVersion
          "::notice title=Windows and afunix.sys::$($cv.ProductName) build $($cv.CurrentBuild).$($cv.UBR), afunix.sys $afunix"

      - name: Runner discovery
        timeout-minutes: 5
        run: flutter test test/runner/runner_discovery_test.dart

      - name: "Serverpod process 1: with no project"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^with no project "

      - name: "Serverpod process 2: a runner someone else started"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^a runner someone else started "

      - name: "Serverpod process 3: a runner App Studio started"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^a runner App Studio started "

      - name: "Serverpod process 4: the preview"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^the preview "

      - name: "Serverpod process 5: runner stages"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^runner stages "

      - name: "Serverpod process 6: actions"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^actions "

      - name: "Serverpod process 7: the log"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^the log "

      - name: "Serverpod process 8: server status"
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: flutter test test/process/serverpod_process_test.dart --name "^server status "

  # The Windows release build and its Inno Setup installer, exactly as
  # tool/windows/build_release.ps1 makes them (GitHub's Windows image has Inno
  # Setup 6). No tests run here, so nothing here opens an AF_UNIX socket.
  windows-installer:
    name: windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build the release and its installer
        shell: powershell
        run: tool\windows\build_release.ps1

      # Annotations can be read without signing in to GitHub; logs cannot.
      - name: Report the installer
        shell: powershell
        run: |
          $f = Get-Item dist\windows\*-setup.exe
          $sha = (Get-Content "$($f.FullName).sha256").Split(' ')[0]
          $mb = [math]::Round($f.Length / 1MB, 1)
          "::notice title=Windows installer::$($f.Name), $mb MB, sha256 $sha"
