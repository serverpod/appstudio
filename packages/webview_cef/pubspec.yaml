name: webview_cef
description: >-
  Local fork of webview_cef with App Studio patches (CEF resize surface sync,
  skip Helper Alerts to avoid duplicate notification prompts).
  Upstream: https://github.com/hlwhl/webview_cef
version: 0.5.1
homepage: https://github.com/hlwhl/webview_cef
repository: https://github.com/hlwhl/webview_cef
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebviewCefPlugin
      windows:
        pluginClass: WebviewCefPluginCApi
      linux:
        pluginClass: WebviewCefPlugin
